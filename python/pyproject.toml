[build-system]
# scikit-build-core drives the CMake build (python/CMakeLists.txt), which
# compiles the native libttio_rans shared library and the optional Cython
# accelerators. The in-tree backend (_build_backend.py) first vendors the
# sibling ../native C sources into ./_native so sdists are self-contained.
# Cython is a build dep for the optional accelerators; their pure-Python
# references produce byte-identical output, just slower.
requires = ["scikit-build-core>=0.9", "cython>=3.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "ttio"
version = "1.7.1"
description = "Python reader/writer for the TTI-O multi-omics data standard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
keywords = ["mass-spectrometry", "NMR", "multi-omics", "HDF5", "mzML", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "h5py>=3.0",
    "numpy>=1.24",
    # Apache Arrow IPC for transport-spec v0.11 tabular packets
    # (IDENTIFICATIONS_TABLE 0x16 + QUANTIFICATIONS_TABLE 0x17). Java
    # uses arrow-vector 16; pyarrow's wire format is logically
    # compatible across all 16.x releases.
    "pyarrow>=16.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
import = ["lxml"]
cloud = ["fsspec", "s3fs", "aiohttp"]
codecs = ["hdf5plugin>=4.0"]
# ZarrProvider reference implementation. The on-disk format uses
# Zarr v3; the dependency is pinned to zarr-python 3.x.
zarr = ["zarr>=3.0"]
# Post-quantum crypto (ML-KEM-1024 + ML-DSA-87) via liboqs. Requires a
# system liboqs >= 0.14 — liboqs-python auto-builds one under
# $HOME/_oqs on first import if missing. See docs/pqc.md for the
# platform matrix (Python/ObjC: liboqs; Java: Bouncy Castle).
pqc = ["liboqs-python>=0.14,<1"]
# Bruker timsTOF TDF importer. opentimspy wraps the open-source
# libtimsdata decoder (ZSTD-compressed frames + scan-to-ion mapping) —
# no proprietary Bruker SDK is involved. The bridge package bundles
# the prebuilt libtimsdata.so / libtimsdata.dll / libtimsdata.dylib so
# pip install is the whole story.
bruker = ["opentimspy>=1.0", "opentims-bruker-bridge>=1.0"]
test = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-cov>=4", "hypothesis>=6", "cryptography>=41.0", "lxml", "fsspec", "aiohttp", "hdf5plugin>=4.0", "zarr>=3.0", "liboqs-python>=0.14,<1", "opentimspy>=1.0", "opentims-bruker-bridge>=1.0", "websockets>=12.0"]
# Integration test extras: pyimzML for imzML imports; pyteomics +
# pymzml for cross-reader validation; isatools is pinned because the
# API churns between minor releases. lxml is included because the
# M64 cross-tool validation tests
# (`tests/validation/test_m64_cross_tool_validation.py`) parse the
# generated mzML / nmrML / ISA-Tab outputs directly via lxml — a
# user who installs ONLY this extra (not paired with `[test]`)
# should still be able to run the full integration suite.
#
# psims provides the PSI-MS controlled vocabulary that pyteomics 5.x
# hard-requires to parse mzML (`PyteomicsError: Parsing PSI formats
# requires psims`). It ships alongside pyteomics so the two never
# install apart (a fresh, offline CI env has no cached CV otherwise).
#
# CI installs `[test,integration]` together (see ci.yml
# python-validation job); `[test]` already includes lxml, so the
# duplicate listing is intentional defensive redundancy, not a leak.
integration = [
    "pyimzml>=1.5",
    "pyteomics>=4.6",
    "psims>=1.2",
    "pymzml>=2.5",
    "isatools>=0.14,<1",
    "lxml",
]
# Streaming transport over WebSocket. The codec itself
# (ttio.transport.packets / .codec) has no network dependency; only
# the TransportServer / TransportClient need websockets.
network = ["websockets>=12.0"]
# API documentation generation via Sphinx + sphinx-autoapi. Renders
# NumPy-style docstrings into HTML under python/docs/_build/html/.
# myst-nb renders the workbench quickstart notebook (execution off).
docs = ["sphinx>=7", "sphinx-autoapi>=3", "furo>=2024.0", "myst-nb>=1"]
all = ["ttio[crypto,import,cloud,codecs,zarr,pqc,bruker]"]

[project.urls]
Homepage = "https://github.com/DTW-Thalion/TTI-O"
Repository = "https://github.com/DTW-Thalion/TTI-O"
Issues = "https://github.com/DTW-Thalion/TTI-O/issues"

[project.entry-points."ttio.providers"]
hdf5 = "ttio.providers.hdf5:Hdf5Provider"
memory = "ttio.providers.memory:MemoryProvider"
sqlite = "ttio.providers.sqlite:SqliteProvider"
zarr = "ttio.providers.zarr:ZarrProvider"

# console_scripts for the three protection tools, giving Python parity
# with the Java (global.thalion.ttio.tools.*) and ObjC
# (objc/Tools/Ttio*) CLI family. ttio-pqc mirrors the subcommand
# grammar of its peers 1:1.
[project.scripts]
ttio-sign = "ttio.tools.ttio_sign_cli:main"
ttio-verify = "ttio.tools.ttio_verify_cli:main"
ttio-pqc = "ttio.tools.ttio_pqc_cli:main"
# W2: spec section 8.2 `ttio` umbrella. Subcommands for login,
# upload, download, stream, inspect, encode, export; W3/W4
# surfaces (query/submit/jobs/sessions) registered as placeholders
# that surface a clear "available in <milestone>" message.
ttio = "ttio.tools.workbench_cli:main"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/ttio"]
# Vendor the native C sources (copied into _native/ by _build_backend.py) into
# the sdist so it can rebuild libttio_rans at install time. py.typed ships the
# typing marker.
sdist.include = ["_native/**", "src/ttio/py.typed"]
# The package is a subdirectory of the git repo, so scikit-build-core cannot
# use git to scope the sdist and would otherwise sweep in everything under
# python/ (a stray .venv, built docs, coverage html, caches). Exclude all of it
# explicitly; the wheel itself is unaffected (it is built from the CMake install
# + wheel.packages, not this list).
sdist.exclude = [
    ".venv", "venv",
    "build", "build_smoke", "dist", "dist_test", "wheelhouse",
    "htmlcov", "docs", "default.profraw", "*.profraw",
    "_native/_build", "_native/_build_tsan",
    "**/__pycache__", "**/*.pyc", "**/*.pyo",
    ".pytest_cache", "**/.pytest_cache",
    "**/*.so", "**/*.dylib", "**/*.dll", "**/*.o", "**/*.a",
    "*.egg-info", "**/*.egg-info",
]
cmake.version = ">=3.16"

[tool.cibuildwheel]
build = "cp311-* cp312-*"
# musllinux + 32-bit + PyPy are out of scope for the first wheel matrix.
skip = "pp* *_i686 *-musllinux*"
build-frontend = "build"
# `import ttio` eagerly imports the workbench client (websockets); the test env
# needs it for the import-based smoke check below.
test-requires = ["websockets"]
test-command = "python -c \"from ttio.codecs import fqzcomp_nx16_z as f; assert f._HAVE_NATIVE_LIB, 'native libttio_rans not bundled'\""

[tool.cibuildwheel.linux]
# The native build's find_package(ZLIB REQUIRED) needs zlib headers in the
# manylinux container. cmake/ninja are fetched by scikit-build-core.
before-all = "yum install -y zlib-devel"
archs = ["x86_64", "aarch64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# zlib ships with the macOS SDK; delocate vendors libttio_rans into the wheel.
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# zlib for the native build comes from the runner's preinstalled vcpkg. The
# static-md triplet links zlib INTO libttio_rans.dll, so the DLL has no external
# zlib dependency to vendor. cibuildwheel's default repair (delvewheel) handles
# the rest. CI-validated only — not exercised on the Linux dev box.
before-all = "vcpkg install zlib:x64-windows-static-md"

[tool.cibuildwheel.windows.environment]
CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not perf and not integration'"
asyncio_mode = "strict"
markers = [
    "slow: tests that take more than ~30s; deselected by default — opt in via `-m slow`",
    "perf: throughput regression smoke; opt in via `-m perf`",
    "integration: end-to-end tests that exercise external binaries / large corpora; opt in via `-m integration`",
]

# Code coverage. CI publishes coverage.xml + htmlcov/ as artefacts and
# gates on the fail_under threshold below.
[tool.coverage.run]
source = ["src/ttio"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/_jcamp_decode.py",  # vendored helper; see comment in module
    # W1 / W2: workbench client surfaces whose only meaningful
    # coverage comes from a live `tti-workbench-server` round-trip
    # (the WS upload/download drivers + the CLI handlers that wrap
    # them). Mirrors the Java JaCoCo exclude pattern. Live-daemon
    # integration tests are tracked as a W1/W2 follow-up in
    # docs/workbench-client/{W1,W2}-progress.md; until they land,
    # these modules are only exercised by structural unit tests in
    # tests/workbench/, which cover the handshake JSON shape but
    # not the WS lifecycle.
    "*/workbench/transport/upload.py",
    "*/workbench/transport/download.py",
    "*/tools/workbench_cli.py",
    # W3: REST clients whose meaningful coverage needs a live
    # daemon round-trip. The pure-data dataclasses + cohort
    # predicate AST stay measured.
    "*/workbench/_http.py",
    "*/workbench/jobs.py",
    "*/workbench/pipeline.py",
    # W4: sessions WS proxy. The session_proxy module owns the
    # async WS lifecycle; the pure-data attach handshake builder
    # and the SessionsClient REST methods that need a daemon
    # round-trip are excluded. The Session record + bind-mount
    # validator in sessions.py stay measured.
    "*/workbench/session_proxy.py",
    # W5.2: containers REST client. The pure-data dataclasses
    # (Container, ContainerDetail, ContainerListPage,
    # ContainerLayer, ContainerManifest) stay measured under
    # tests/workbench/test_containers.py; the HTTP-method
    # wrappers need a live daemon.
    "*/workbench/containers.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Minimum overall line coverage. Restored to 84 (from a temporary 76
# floor introduced post-#48) by the coverage-restoration plan landed
# in #50: targeted tests added for transport.{codec,packets} (#P.1),
# tools.{fasta,fastq,per_au}_cli (#P.3), codecs.rans, _hdf5_io, and
# encryption (#P.3b). Local/CI pytest run now measures ~87% (post
# R1/R3); the 86 floor (ratcheted from 84 in R6, 2026-06-06) leaves a
# ~1pt buffer. Never decrease without a recorded reason. Vendor-importer
# files (Bruker / Thermo / Waters) remain excluded from targeted
# coverage work — they need proprietary fixtures.
fail_under = 86
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
