# coverage.py config for the R8 Cython linetrace coverage run ONLY.
# Separate from pyproject.toml's [tool.coverage] so the always-on Python
# gate is untouched. Requires the package built with
# -DTTIO_CYTHON_LINETRACE=ON and the env var CYTHON_TRACE=1 at runtime.
# Driven by scripts/run_cython_coverage.py (which sets COVERAGE_CORE=ctrace,
# CYTHON_TRACE=1, stages the generated .c next to each .pyx, pre-imports numpy,
# and disables pytest-cov). _fqzcomp_nx16_z is intentionally excluded: its
# Cython extension is superseded by the required native libttio_rans (the
# wrapper never calls the Cython ext, so it is never runtime-exercised). The
# native fqzcomp C is covered by scripts/native-coverage.sh.
[run]
plugins = Cython.Coverage
branch = True
source =
    ttio.codecs._rans
    ttio.codecs._delta_rans

[report]
show_missing = True
skip_covered = False
# R8 baseline measured 2026-06-17: TOTAL 76.3% line (_rans + _delta_rans).
# Floor 73 (measured - ~3pt), enforced via run_cython_coverage.py --fail-under in native-coverage.yml.
# fail_under is NOT set here; the floor is enforced via run_cython_coverage.py --fail-under in CI.
# Per-file: _rans.pyx 76%, _delta_rans.pyx 77%. _fqzcomp_nx16_z.pyx is NOT exercised: the
# fqzcomp codec prefers the native C lib (_HAVE_NATIVE_LIB) and the Cython _ext is
# imported-but-unused, so no existing test drives encode_full_c/decode_body_c (0%).
