# Coverage config for the LIVE-DAEMON workbench-client gate (R7).
#
# Used only by scripts/workbench-live-smoke.sh when TTIOWB_COVERAGE=1, to
# measure + gate the workbench client modules that pyproject.toml's
# [tool.coverage.run] omit deliberately drops from the always-on ci.yml gate
# (their only meaningful coverage comes from a real tti-workbench-server
# round-trip, which runs only in .github/workflows/workbench-live.yml).
#
# Scope is src/ttio/workbench only, WITHOUT the workbench omits, so the WS
# upload/download drivers + REST clients exercised by
# tests/integration/test_workbench_live.py are measured and floored here.
# tools/workbench_cli.py is out of scope (lives under tools/, not workbench/,
# and is not driven by the live client tests).
#
# See docs/superpowers/plans/2026-06-16-r7-live-coverage-gate.md.
[run]
branch = true
# Measure ONLY the omitted-from-ci.yml client modules the live test drives.
# The runner passes a bare `--cov` (no source) so this include allowlist
# applies (include matches by file path; source would override it). Other
# workbench modules (client, cohort, auth*, handshake, sessions, federation,
# selective_access) are NOT omitted in ci.yml — unit-tested there, out of
# scope here. session_proxy.py + tools/workbench_cli.py stay omitted+ungated:
# the current live test does not attach a session WS / drive the CLI
# (a future W-item — noted in the plan + the pyproject/pom comments).
include =
    */ttio/workbench/_http.py
    */ttio/workbench/jobs.py
    */ttio/workbench/pipeline.py
    */ttio/workbench/containers.py
    */ttio/workbench/transport/upload.py
    */ttio/workbench/transport/download.py

[report]
show_missing = true
skip_covered = false
# Floor set empirically: the live run measures 70% over these 6 modules
# (2026-06-16); 67 leaves a ~3pt buffer on a brand-new gate. Pure-Python
# coverage is deterministic CI<->local (unlike ObjC). Never decrease without
# a recorded reason; ratchet up as the live test grows.
fail_under = 67
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
