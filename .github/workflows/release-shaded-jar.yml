name: Release shaded jar (per-platform)

# Triggers:
#   - tag push starting with v* (canonical release path)
#   - manual workflow_dispatch (smoke-test the bundle without cutting a tag)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to create the Release

jobs:
  build-platform-jar:
    name: Build per-platform shaded JAR (${{ matrix.classifier }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x64
            os: ubuntu-22.04
          - classifier: mac-aarch64
            os: macos-14
          - classifier: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # === LINUX X64 ===
      - name: Install build deps (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              clang cmake ninja-build zlib1g-dev libssl-dev git ca-certificates

      - name: Build native libttio_rans_jni (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DTTIO_RANS_BUILD_JNI=ON -DBUILD_TESTING=OFF native
          cmake --build native/_build --parallel

      - name: Build HDF5 1.14 + LZ4 plugin (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          bash scripts/install-hdf5.sh 1.14.6
          sudo bash scripts/build-h5lz4.sh master
          sudo ldconfig

      - name: Stage natives (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          mkdir -p tio-browser/src/main/resources/native/linux-x64/hdf5
          cp native/_build/libttio_rans_jni.so tio-browser/src/main/resources/native/linux-x64/
          cp /usr/local/lib/libhdf5.so.310 tio-browser/src/main/resources/native/linux-x64/hdf5/
          cp /usr/local/lib/libhdf5_hl.so.310 tio-browser/src/main/resources/native/linux-x64/hdf5/
          cp /usr/local/lib/libhdf5_java.so tio-browser/src/main/resources/native/linux-x64/hdf5/
          # build-h5lz4.sh installs to ${PREFIX}/lib/plugin/ (HDF5 plugin convention).
          cp /usr/local/lib/plugin/libh5lz4.so tio-browser/src/main/resources/native/linux-x64/hdf5/ \
              || cp /usr/local/lib/libh5lz4.so tio-browser/src/main/resources/native/linux-x64/hdf5/
          ls -la tio-browser/src/main/resources/native/linux-x64/
          ls -la tio-browser/src/main/resources/native/linux-x64/hdf5/

      # === MAC AARCH64 ===
      - name: Install build deps (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          brew update || true
          brew install cmake ninja || true

      - name: Build native libttio_rans_jni (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DTTIO_RANS_BUILD_JNI=ON -DBUILD_TESTING=OFF native
          cmake --build native/_build --parallel

      - name: Build HDF5 1.14 + LZ4 plugin (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          bash scripts/install-hdf5.sh 1.14.6
          sudo bash scripts/build-h5lz4.sh master

      - name: Stage natives (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          mkdir -p tio-browser/src/main/resources/native/mac-aarch64/hdf5
          cp native/_build/libttio_rans_jni.dylib tio-browser/src/main/resources/native/mac-aarch64/
          cp /usr/local/lib/libhdf5.310.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          cp /usr/local/lib/libhdf5_hl.310.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          cp /usr/local/lib/libhdf5_java.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          # The upstream hdf5_plugins cmake doesn't follow macOS module-naming
          # conventions — it always installs `libh5lz4.so` regardless of
          # platform. Stage it with the proper .dylib extension so
          # Hdf5NativeLoader.MAC_LIBS finds it.
          cp /usr/local/lib/plugin/libh5lz4.so tio-browser/src/main/resources/native/mac-aarch64/hdf5/libh5lz4.dylib \
              || cp /usr/local/lib/plugin/libh5lz4.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          ls -la tio-browser/src/main/resources/native/mac-aarch64/
          ls -la tio-browser/src/main/resources/native/mac-aarch64/hdf5/

      # === WIN X64 ===
      # NOTE: HDF5 is built from source (not pacman) because MSYS2's
      # mingw-w64-ucrt-x86_64-hdf5 package omits the JNI shim
      # (libhdf5_java.dll), which Hdf5NativeLoader requires at launch.
      # scripts/install-hdf5.sh's `--enable-java` produces it as part of
      # the source build — same path Linux + macOS already use.
      - name: Set up MSYS2 (win-x64)
        if: matrix.classifier == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # path-type: inherit makes the GitHub Windows runner's
          # pre-installed Maven (and other tools) reachable from inside
          # the `shell: msys2 {0}` steps. MSYS2 packages are still
          # prepended on PATH so MSYS2 tools (bash, cmake, gcc, etc.)
          # take precedence over any Windows equivalents.
          # (Default 'minimal' strips Windows tools; that's why
          # `mvn: command not found` in the win-x64 mvn install step.)
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-make
            autoconf
            automake
            libtool
            make

      - name: Build native libttio_rans_jni (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DTTIO_RANS_BUILD_JNI=ON -DBUILD_TESTING=OFF native
          cmake --build native/_build --parallel

      - name: Build HDF5 1.14 + JNI shim (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        env:
          HDF5_PREFIX: /ucrt64
        run: |
          # Save the Temurin JAVA_HOME (Windows path form) before translating.
          JAVA_HOME_WIN="$JAVA_HOME"

          # Build wrapper scripts that translate POSIX CLASSPATH to Windows
          # form before invoking the real Temurin tools. HDF5's --enable-java
          # build emits CLASSPATH with POSIX colons, which Windows .exe tools
          # parse as one giant invalid path entry.
          mkdir -p /tmp/javac-wrap
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# Forward to Temurin javac.exe with CLASSPATH converted from POSIX (:)'
            printf '%s\n' '# to Windows (;) form.'
            printf '%s\n' 'if [ -n "$CLASSPATH" ]; then'
            printf '%s\n' '    export CLASSPATH=$(cygpath -wp "$CLASSPATH")'
            printf '%s\n' 'fi'
            printf 'exec "%s/bin/javac.exe" "$@"\n' "$JAVA_HOME_WIN"
          } > /tmp/javac-wrap/javac
          chmod +x /tmp/javac-wrap/javac

          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# Forward to Temurin java.exe with CLASSPATH converted from POSIX (:)'
            printf '%s\n' 'if [ -n "$CLASSPATH" ]; then'
            printf '%s\n' '    export CLASSPATH=$(cygpath -wp "$CLASSPATH")'
            printf '%s\n' 'fi'
            printf 'exec "%s/bin/java.exe" "$@"\n' "$JAVA_HOME_WIN"
          } > /tmp/javac-wrap/java
          chmod +x /tmp/javac-wrap/java

          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# Forward to Temurin jar.exe (CLASSPATH translation kept for safety)'
            printf '%s\n' 'if [ -n "$CLASSPATH" ]; then'
            printf '%s\n' '    export CLASSPATH=$(cygpath -wp "$CLASSPATH")'
            printf '%s\n' 'fi'
            printf 'exec "%s/bin/jar.exe" "$@"\n' "$JAVA_HOME_WIN"
          } > /tmp/javac-wrap/jar
          chmod +x /tmp/javac-wrap/jar

          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# Forward to Temurin javadoc.exe with CLASSPATH translated POSIX -> Windows.'
            printf '%s\n' 'if [ -n "$CLASSPATH" ]; then'
            printf '%s\n' '    export CLASSPATH=$(cygpath -wp "$CLASSPATH")'
            printf '%s\n' 'fi'
            printf 'exec "%s/bin/javadoc.exe" "$@"\n' "$JAVA_HOME_WIN"
          } > /tmp/javac-wrap/javadoc
          chmod +x /tmp/javac-wrap/javadoc

          # javah is removed in JDK 10+; create as a no-op or symlink to javac
          # for autoconf probes that check it. javac in JDK 16+ supports the
          # -h flag for header generation, which is what HDF5 actually uses.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# javah is removed in JDK 10+; no-op for autoconf probes.'
            printf '%s\n' 'echo "javah is removed in JDK 10+; use javac -h instead" >&2'
            printf '%s\n' 'exit 1'
          } > /tmp/javac-wrap/javah
          chmod +x /tmp/javac-wrap/javah

          # Construct the fake JAVA_HOME tree.
          export JAVA_HOME=/tmp/javac-wrap-jdk
          mkdir -p $JAVA_HOME/bin
          ln -sf /tmp/javac-wrap/javac $JAVA_HOME/bin/javac
          ln -sf /tmp/javac-wrap/java  $JAVA_HOME/bin/java
          ln -sf /tmp/javac-wrap/jar   $JAVA_HOME/bin/jar
          ln -sf /tmp/javac-wrap/javadoc $JAVA_HOME/bin/javadoc
          ln -sf /tmp/javac-wrap/javah $JAVA_HOME/bin/javah

          # JNI shim compile needs $JAVA_HOME/include/jni.h and
          # $JAVA_HOME/include/win32/jni_md.h. Symlink Temurin's include/
          # into our fake JAVA_HOME so HDF5's JNI source compiles.
          ln -sf "$(cygpath -u "$JAVA_HOME_WIN")/include" $JAVA_HOME/include

          # Add the fake JDK's bin to PATH (so all java tooling resolves to wrappers)
          export PATH="$JAVA_HOME/bin:$PATH"

          # Diagnostics
          javac -version
          java -version
          which javac java jar javadoc
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME_WIN=$JAVA_HOME_WIN"
          ls -la $JAVA_HOME/include/jni.h
          ls -la $JAVA_HOME/include/win32/jni_md.h

          bash scripts/install-hdf5.sh 1.14.6

      - name: Build LZ4 plugin (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        run: |
          PREFIX=/ucrt64 bash scripts/build-h5lz4.sh master

      - name: Stage natives (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        run: |
          mkdir -p tio-browser/src/main/resources/native/win-x64/hdf5
          cp native/_build/ttio_rans_jni.dll tio-browser/src/main/resources/native/win-x64/
          # HDF5 from-source build (libtool) emits versioned DLLs into
          # /ucrt64/bin: libhdf5-310.dll, libhdf5_hl-310.dll, libhdf5_java.dll
          # (the JNI shim has no version suffix). Rename to the
          # unversioned, lib-prefix-stripped names Hdf5NativeLoader expects.
          cp /ucrt64/bin/libhdf5-310.dll      tio-browser/src/main/resources/native/win-x64/hdf5/hdf5.dll
          cp /ucrt64/bin/libhdf5_hl-310.dll   tio-browser/src/main/resources/native/win-x64/hdf5/hdf5_hl.dll
          cp /ucrt64/bin/libhdf5_java.dll     tio-browser/src/main/resources/native/win-x64/hdf5/hdf5_java.dll
          # h5lz4 plugin install path varies by upstream cmake version; try common spots.
          (cp /ucrt64/lib/plugin/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/lib/plugin/libh5lz4.so tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/bin/plugin/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/lib/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/bin/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (echo "::error::libh5lz4.{dll,so} not found under /ucrt64" && find /ucrt64 -name 'libh5lz4*' && exit 1)

          # Bundle MinGW runtime DLL dependencies of the HDF5 + plugin DLLs.
          # On a clean Windows machine without MSYS2, Windows' standard
          # LoadLibrary search order does NOT include the directory of the
          # loaded DLL when resolving dependencies, so hdf5*.dll's imports
          # for libwinpthread-1.dll, libgcc_s_seh-1.dll, libcurl-4.dll,
          # libssl-3-x64.dll, libcrypto-3-x64.dll, libz-1.dll, etc. all
          # fail with "Can't find dependent libraries" (incident: v1.4.0
          # first release was broken on user installs).
          #
          # Recursively walk dependencies via ldd and bundle every
          # /ucrt64/bin/ DLL into the resources tree. Hdf5NativeLoader
          # extracts and System.load's them in multi-pass order at runtime.
          echo "::group::Bundle MinGW DLL dependency closure"
          NATIVE_DIR=tio-browser/src/main/resources/native/win-x64/hdf5
          while true; do
              changed=0
              for dll in "$NATIVE_DIR"/*.dll; do
                  for dep in $(ldd "$dll" 2>/dev/null | awk '$3 ~ "^/ucrt64/bin/" { print $3 }'); do
                      dep_name=$(basename "$dep")
                      if [ ! -f "$NATIVE_DIR/$dep_name" ]; then
                          echo "  bundling: $dep_name (dep of $(basename "$dll"))"
                          cp "$dep" "$NATIVE_DIR/$dep_name"
                          changed=1
                      fi
                  done
              done
              [ $changed -eq 0 ] && break
          done
          echo "::endgroup::"

          ls -la tio-browser/src/main/resources/native/win-x64/
          ls -la tio-browser/src/main/resources/native/win-x64/hdf5/
          echo "Total bundled DLLs: $(ls -1 "$NATIVE_DIR" | wc -l)"

      # The tio-browser pom depends on global.thalion:ttio:1.2.0 (the
      # underlying TTI-O Java library at java/). It's an internal monorepo
      # dep, so we must `mvn install` it to local M2 before the tio-browser
      # build can resolve it. -Djacoco.skip=true is required alongside
      # -DskipTests because jacoco-check fails without coverage data.
      # The -Dhdf5.jar= path differs per platform (from-source install
      # locations: /usr/local/lib on Linux+Mac, /ucrt64/lib on MSYS2).
      # The Java ttio pom uses `<systemPath>${hdf5.jar.path}</systemPath>`
      # for the system-scope jarhdf5 dep. NOTE: property is `hdf5.jar.path`,
      # not `hdf5.jar`. Earlier `-Dhdf5.jar=...` flags were silently ignored;
      # Linux/macOS still succeeded because the unix-family `linux-system-hdf5`
      # profile in java/pom.xml defaults the property to
      # /usr/local/lib/jarhdf5.jar. Windows doesn't activate that profile,
      # so the property MUST be set on the cmdline for win-x64 mvn install
      # to find the jar.
      - name: Install ttio library to local M2 (linux-x64)
        if: matrix.classifier == 'linux-x64'
        working-directory: java
        run: mvn -B install -DskipTests -Djacoco.skip=true -Dhdf5.jar.path=/usr/local/lib/jarhdf5.jar

      - name: Install ttio library to local M2 (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        working-directory: java
        run: mvn -B install -DskipTests -Djacoco.skip=true -Dhdf5.jar.path=/usr/local/lib/jarhdf5.jar

      - name: Install ttio library to local M2 (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        working-directory: java
        run: |
          # mvn here is the runner's pre-installed Windows Maven (reachable
          # because the MSYS2 step uses path-type: inherit). Windows Maven
          # doesn't understand POSIX paths, so convert the system-scope
          # hdf5.jar.path arg from MSYS2 (/ucrt64/...) to Windows form
          # (D:\a\_temp\msys64\ucrt64\...) before passing.
          HDF5_JAR_WIN=$(cygpath -w /ucrt64/lib/jarhdf5.jar)
          echo "Resolved hdf5.jar.path: $HDF5_JAR_WIN"
          mvn -B install -DskipTests -Djacoco.skip=true -Dhdf5.jar.path="$HDF5_JAR_WIN"

      - name: Build shaded JAR
        working-directory: tio-browser
        shell: bash
        run: mvn -B -P ${{ matrix.classifier }} -DskipTests package

      - name: Verify shaded JAR contents
        working-directory: tio-browser
        shell: bash
        run: |
          JAR=$(ls target/tio-browser-*-${{ matrix.classifier }}.jar | head -1)
          echo "Inspecting $JAR (size: $(du -h "$JAR" | cut -f1))"
          # Sanity: must include this platform's native tree, must NOT include the others
          jar -tf "$JAR" | grep "^native/${{ matrix.classifier }}/" | head -5
          if jar -tf "$JAR" | grep -E "^native/(linux-x64|mac-aarch64|win-x64)/" | grep -v "^native/${{ matrix.classifier }}/"; then
              echo "::error::JAR contains other-platform native resources"
              exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tio-browser-${{ matrix.classifier }}
          path: tio-browser/target/tio-browser-*-${{ matrix.classifier }}.jar
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-platform-jar
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: ls -la artifacts/*/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/tio-browser-*.jar
          fail_on_unmatched_files: true
