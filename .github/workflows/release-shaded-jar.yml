name: Release shaded jar (per-platform)

# Triggers:
#   - tag push starting with v* (canonical release path)
#   - manual workflow_dispatch (smoke-test the bundle without cutting a tag)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to create the Release

jobs:
  build-platform-jar:
    name: Build per-platform shaded JAR (${{ matrix.classifier }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x64
            os: ubuntu-22.04
          - classifier: mac-aarch64
            os: macos-14
          - classifier: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # === LINUX X64 ===
      - name: Install build deps (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              clang cmake ninja-build zlib1g-dev libssl-dev git ca-certificates

      - name: Build native libttio_rans_jni (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release native
          cmake --build native/_build --parallel

      - name: Build HDF5 1.14 + LZ4 plugin (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          bash scripts/install-hdf5.sh 1.14.6
          sudo bash scripts/build-h5lz4.sh master
          sudo ldconfig

      - name: Stage natives (linux-x64)
        if: matrix.classifier == 'linux-x64'
        run: |
          mkdir -p tio-browser/src/main/resources/native/linux-x64/hdf5
          cp native/_build/libttio_rans_jni.so tio-browser/src/main/resources/native/linux-x64/
          cp /usr/local/lib/libhdf5.so.310 tio-browser/src/main/resources/native/linux-x64/hdf5/
          cp /usr/local/lib/libhdf5_hl.so.310 tio-browser/src/main/resources/native/linux-x64/hdf5/
          cp /usr/local/lib/libhdf5_java.so tio-browser/src/main/resources/native/linux-x64/hdf5/
          cp /usr/local/lib/libh5lz4.so tio-browser/src/main/resources/native/linux-x64/hdf5/
          ls -la tio-browser/src/main/resources/native/linux-x64/
          ls -la tio-browser/src/main/resources/native/linux-x64/hdf5/

      # === MAC AARCH64 ===
      - name: Install build deps (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          brew update || true
          brew install cmake ninja || true

      - name: Build native libttio_rans_jni (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release native
          cmake --build native/_build --parallel

      - name: Build HDF5 1.14 + LZ4 plugin (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          bash scripts/install-hdf5.sh 1.14.6
          sudo bash scripts/build-h5lz4.sh master

      - name: Stage natives (mac-aarch64)
        if: matrix.classifier == 'mac-aarch64'
        run: |
          mkdir -p tio-browser/src/main/resources/native/mac-aarch64/hdf5
          cp native/_build/libttio_rans_jni.dylib tio-browser/src/main/resources/native/mac-aarch64/
          cp /usr/local/lib/libhdf5.310.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          cp /usr/local/lib/libhdf5_hl.310.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          cp /usr/local/lib/libhdf5_java.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          cp /usr/local/lib/libh5lz4.dylib tio-browser/src/main/resources/native/mac-aarch64/hdf5/
          ls -la tio-browser/src/main/resources/native/mac-aarch64/
          ls -la tio-browser/src/main/resources/native/mac-aarch64/hdf5/

      # === WIN X64 ===
      # NOTE: HDF5 is built from source (not pacman) because MSYS2's
      # mingw-w64-ucrt-x86_64-hdf5 package omits the JNI shim
      # (libhdf5_java.dll), which Hdf5NativeLoader requires at launch.
      # scripts/install-hdf5.sh's `--enable-java` produces it as part of
      # the source build — same path Linux + macOS already use.
      - name: Set up MSYS2 (win-x64)
        if: matrix.classifier == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-make
            autoconf
            automake
            libtool
            make

      - name: Build native libttio_rans_jni (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release native
          cmake --build native/_build --parallel

      - name: Build HDF5 1.14 + JNI shim (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        env:
          # Install into /ucrt64 so the result sits alongside MSYS2's
          # other libs (default /usr/local is not on the UCRT64 lib path).
          HDF5_PREFIX: /ucrt64
        run: |
          # JAVA_HOME is set by actions/setup-java@v4 in Windows path form
          # (e.g. C:\hostedtoolcache\...\jdk\x64). Translate to MSYS2 form
          # (/c/hostedtoolcache/.../jdk/x64) so HDF5's configure can find
          # javac/jni.h for the --enable-java JNI shim build.
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          echo "JAVA_HOME (msys2 form) = $JAVA_HOME"
          bash scripts/install-hdf5.sh 1.14.6

      - name: Build LZ4 plugin (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        run: |
          PREFIX=/ucrt64 bash scripts/build-h5lz4.sh master

      - name: Stage natives (win-x64)
        if: matrix.classifier == 'win-x64'
        shell: msys2 {0}
        run: |
          mkdir -p tio-browser/src/main/resources/native/win-x64/hdf5
          cp native/_build/ttio_rans_jni.dll tio-browser/src/main/resources/native/win-x64/
          # HDF5 from-source build (libtool) emits versioned DLLs into
          # /ucrt64/bin: libhdf5-310.dll, libhdf5_hl-310.dll, libhdf5_java.dll
          # (the JNI shim has no version suffix). Rename to the
          # unversioned, lib-prefix-stripped names Hdf5NativeLoader expects.
          cp /ucrt64/bin/libhdf5-310.dll      tio-browser/src/main/resources/native/win-x64/hdf5/hdf5.dll
          cp /ucrt64/bin/libhdf5_hl-310.dll   tio-browser/src/main/resources/native/win-x64/hdf5/hdf5_hl.dll
          cp /ucrt64/bin/libhdf5_java.dll     tio-browser/src/main/resources/native/win-x64/hdf5/hdf5_java.dll
          # h5lz4 plugin install path varies by upstream cmake version; try common spots.
          (cp /ucrt64/lib/plugin/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/lib/plugin/libh5lz4.so tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/bin/plugin/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/lib/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (cp /ucrt64/bin/libh5lz4.dll tio-browser/src/main/resources/native/win-x64/hdf5/h5lz4.dll 2>/dev/null) \
              || (echo "::error::libh5lz4.{dll,so} not found under /ucrt64" && find /ucrt64 -name 'libh5lz4*' && exit 1)
          ls -la tio-browser/src/main/resources/native/win-x64/
          ls -la tio-browser/src/main/resources/native/win-x64/hdf5/

      - name: Build shaded JAR
        working-directory: tio-browser
        shell: bash
        run: mvn -B -P ${{ matrix.classifier }} -DskipTests package

      - name: Verify shaded JAR contents
        working-directory: tio-browser
        shell: bash
        run: |
          JAR=$(ls target/tio-browser-*-${{ matrix.classifier }}.jar | head -1)
          echo "Inspecting $JAR (size: $(du -h "$JAR" | cut -f1))"
          # Sanity: must include this platform's native tree, must NOT include the others
          jar -tf "$JAR" | grep "^native/${{ matrix.classifier }}/" | head -5
          if jar -tf "$JAR" | grep -E "^native/(linux-x64|mac-aarch64|win-x64)/" | grep -v "^native/${{ matrix.classifier }}/"; then
              echo "::error::JAR contains other-platform native resources"
              exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tio-browser-${{ matrix.classifier }}
          path: tio-browser/target/tio-browser-*-${{ matrix.classifier }}.jar
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-platform-jar
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: ls -la artifacts/*/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/tio-browser-*.jar
          fail_on_unmatched_files: true
