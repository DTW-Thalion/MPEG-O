name: Release shaded jar (per-platform)

# Triggers:
#   - tag push starting with v* (canonical release path)
#   - manual workflow_dispatch (smoke-test the bundle without cutting a tag)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to create the Release

jobs:
  build-platform-jar:
    name: Build per-platform shaded JAR (${{ matrix.classifier }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x64
            os: ubuntu-22.04
          - classifier: mac-aarch64
            os: macos-14
          - classifier: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Per-platform native build steps land in D.2/D.3/D.4. This task
      # only sets up the shell — the per-platform `if: matrix.classifier == ...`
      # gating goes here:

      # === LINUX X64 ===
      # (D.2 will add: apt install + install-hdf5.sh + build-h5lz4.sh + libttio_rans_jni cmake build + staging)

      # === MAC AARCH64 ===
      # (D.3 will add: brew install + install-hdf5.sh + build-h5lz4.sh + libttio_rans_jni cmake build + staging)

      # === WIN X64 ===
      # (D.4 will add: msys2 setup + pacman install + build-h5lz4.sh + libttio_rans_jni MinGW build + staging)

      - name: Build shaded JAR
        working-directory: tio-browser
        shell: bash
        run: mvn -B -P ${{ matrix.classifier }} -DskipTests package

      - name: Verify shaded JAR contents
        working-directory: tio-browser
        shell: bash
        run: |
          JAR=$(ls target/tio-browser-*-${{ matrix.classifier }}.jar | head -1)
          echo "Inspecting $JAR (size: $(du -h "$JAR" | cut -f1))"
          # Sanity: must include this platform's native tree, must NOT include the others
          jar -tf "$JAR" | grep "^native/${{ matrix.classifier }}/" | head -5
          if jar -tf "$JAR" | grep -E "^native/(linux-x64|mac-aarch64|win-x64)/" | grep -v "^native/${{ matrix.classifier }}/"; then
              echo "::error::JAR contains other-platform native resources"
              exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tio-browser-${{ matrix.classifier }}
          path: tio-browser/target/tio-browser-*-${{ matrix.classifier }}.jar
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-platform-jar
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: ls -la artifacts/*/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/tio-browser-*.jar
          fail_on_unmatched_files: true
