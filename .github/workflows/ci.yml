name: TTIO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # v0.9 M64: nightly stress run at 02:30 UTC (10:30 PM Eastern).
  # The python-stress job below only runs on this schedule.
  # The python-stress-full-corpus job runs monthly (1st of each
  # month at 03:00 UTC) and exercises the 1.6 GB hg002_illumina
  # chr22 BAM that the default nightly excludes for budget reasons.
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 3 1 * *"

jobs:
  objc-build-test:
    name: Objective-C — build & test (libobjc2 / gnustep-2.0)
    runs-on: ubuntu-latest

    # We mirror the canonical developer setup: clang + libobjc2 +
    # gnustep-make + gnustep-base built from source. This is the path the
    # TTIO preamble's runtime auto-detect identifies as `gnustep-2.0`
    # (non-fragile ABI), which enables `-fblocks` and avoids the layered
    # incompatibilities of Ubuntu's apt gnustep-1.8 / GCC libobjc combo.
    #
    # Build cost: ~90 seconds for the three from-source components.
    # Cached across runs via the `cache` step keyed on the upstream tags.
    env:
      LIBOBJC2_REF: v2.3
      TOOLS_MAKE_REF: make-2_9_3
      LIBS_BASE_REF:  base-1_31_1
      INSTALL_PREFIX: /usr/local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            make \
            git \
            ca-certificates \
            zlib1g-dev \
            libssl-dev \
            libxml2-dev \
            libgnutls28-dev \
            libffi-dev \
            libicu-dev \
            libblocksruntime-dev \
            libcurl4-openssl-dev \
            libwebsockets-dev \
            tzdata

      - name: Cache GNUstep stack (libobjc2 + tools-make + libs-base)
        id: gnustep-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/include/objc
            /usr/local/include/GNUstep
            /usr/local/lib/libobjc.so*
            /usr/local/lib/libgnustep-base*
            /usr/local/lib/GNUstep
            /usr/local/share/GNUstep
            /usr/local/bin/gnustep-config
            /usr/local/bin/gdomap
          key: gnustep-${{ runner.os }}-${{ env.LIBOBJC2_REF }}-${{ env.TOOLS_MAKE_REF }}-${{ env.LIBS_BASE_REF }}-v2

      - name: Build libobjc2 from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          git clone --depth 1 --branch "${LIBOBJC2_REF}" \
            https://github.com/gnustep/libobjc2.git /tmp/libobjc2
          cd /tmp/libobjc2
          git submodule update --init --recursive
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            ..
          ninja
          sudo ninja install

      - name: Build gnustep-make from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          git clone --depth 1 --branch "${TOOLS_MAKE_REF}" \
            https://github.com/gnustep/tools-make.git /tmp/tools-make
          cd /tmp/tools-make
          ./configure \
            --prefix="${INSTALL_PREFIX}" \
            --with-library-combo=ng-gnu-gnu \
            CC=clang
          make
          sudo make install

      - name: Build gnustep-base from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          # shellcheck disable=SC1091
          . "${INSTALL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          git clone --depth 1 --branch "${LIBS_BASE_REF}" \
            https://github.com/gnustep/libs-base.git /tmp/libs-base
          cd /tmp/libs-base
          ./configure CC=clang
          make
          sudo -E make install

      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Show toolchain versions
        run: |
          clang --version
          ${INSTALL_PREFIX}/bin/gnustep-config --variable=GNUSTEP_MAKEFILES
          ${INSTALL_PREFIX}/bin/gnustep-config --objc-flags || true
          grep -oP 'HDF5 Version:\s+\K[\d.]+' /usr/local/lib/libhdf5.settings 2>/dev/null || echo 'HDF5 settings not found'
          ls -l ${INSTALL_PREFIX}/lib/libobjc.so* || true
          ls -l ${INSTALL_PREFIX}/lib/libgnustep-base.so* || true


      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib
      # M23: probe H5is_library_threadsafe() and log the result. Source-built
      # HDF5 1.14.6 is serial (not threadsafe); TTIOHDF5File detects that at open
      # falls back to exclusive-only wrapper locking (see -isThreadSafe).
      # The log makes the runtime mode visible in every CI run.
      - name: Probe HDF5 thread-safety (informational)
        run: |
          set -eo pipefail
          cat > /tmp/h5ts.c <<'EOF'
          #include <hdf5.h>
          #include <stdio.h>
          int main(void) {
              hbool_t ts = 0;
              if (H5is_library_threadsafe(&ts) < 0) { puts("probe failed"); return 2; }
              printf("H5is_library_threadsafe: %s\n", ts ? "YES" : "NO");
              return 0;
          }
          EOF
          clang /tmp/h5ts.c -I/usr/local/include -L/usr/local/lib -lhdf5 -Wl,-rpath,/usr/local/lib -o /tmp/h5ts
          /tmp/h5ts

      - name: Build native libttio_rans (required by ObjC genomic codecs)
        run: ./scripts/build-native.sh

      - name: Dependency check
        working-directory: objc
        run: ./check-deps.sh

      - name: Build libTTIO
        working-directory: objc
        run: ./build.sh

      - name: Run tests
        working-directory: objc
        run: ./build.sh check

      # V1: opt-in coverage build. Runs after the main test pass so a
      # coverage-build failure (e.g. linker can't find profile runtime)
      # doesn't gate the green check on the existing tests.
      # `continue-on-error: true` keeps the job green even if llvm-cov
      # tooling is not in the GHA image.
      - name: Coverage build (opt-in)
        working-directory: objc
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends llvm
          ./build.sh clean
          ./build.sh --coverage check

      - name: Upload coverage (LLVM lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objc-coverage
          path: |
            objc/coverage/coverage.lcov
            objc/coverage/coverage.profdata
          if-no-files-found: warn
          retention-days: 14

  python-test:
    name: Python — build & test (ttio package)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Run 3.12 on every PR/push; expand to the full supported matrix
      # (3.11 + 3.12) on the nightly schedule. Floor is 3.11 per
      # python/pyproject.toml `requires-python`; nightly catches
      # 3.11-only regressions without paying ~9min of CI per PR.
      matrix:
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    env:
      # Phase 2c-T + v2 codecs (mate_info_v2, ref_diff_v2,
      # name_tokenized_v2, fqzcomp_nx16_z) require the native rANS
      # shared library at runtime. Built fresh in the cmake step
      # below. The resolver in `python/tests/validation/test_*` also
      # falls back to `native/_build/libttio_rans.so` from the repo
      # root when this env var is unset; we set it explicitly so
      # subprocess-driven tests (Java / ObjC sibling CLIs) inherit
      # the same path.
      TTIO_RANS_LIB_PATH: ${{ github.workspace }}/native/_build/libttio_rans.so

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev \
            cmake \
            ninja-build \
            samtools

      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib

      - name: Build native rANS library
        # Required for the v2 genomic codecs (MATE_INLINE_V2,
        # REF_DIFF_V2, NAME_TOKENIZED_V2, FQZCOMP_NX16_Z) and the
        # Phase 2c-T transport bulk-mode tests. Without this step,
        # ~90 tests silently skip or run in degraded paths.
        run: |
          cmake -B native/_build -G Ninja -DCMAKE_BUILD_TYPE=Release native
          cmake --build native/_build --parallel

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/liboqs.so
          key: liboqs-0.14.0-${{ runner.os }}
      - name: Install liboqs (PQC native library)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: bash scripts/install-liboqs.sh 0.14.0
      - name: Update ldconfig for liboqs (always)
        run: sudo ldconfig /usr/local/lib

      - name: Install ttio in editable mode
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test]"

      - name: Run pytest (default filter — no stress, no requires_network)
        working-directory: python
        # V1 (verification workplan): pytest-cov runs on every matrix
        # entry; XML/HTML reports are uploaded only on the 3.12 leg
        # below so we don't double-upload artifacts.
        # C7 (coverage workplan): --cov-fail-under gates the build at
        # the post-C-series baseline. Bump in tandem with
        # pyproject.toml's [tool.coverage.report] fail_under after
        # intentional coverage improvements.
        run: pytest -v --tb=short --cov=src/ttio --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=84

      # V1: publish coverage on the 3.12 leg only.
      - name: Upload coverage (Python 3.12 only)
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            python/coverage.xml
            python/htmlcov/
          if-no-files-found: warn
          retention-days: 14

  python-validation:
    name: Python — M64 cross-tool validation (optional deps)
    runs-on: ubuntu-latest
    needs: python-test
    env:
      TTIO_RANS_LIB_PATH: ${{ github.workspace }}/native/_build/libttio_rans.so

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev cmake ninja-build

      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib

      - name: Build native rANS library (JNI)
        run: bash scripts/build-native.sh --jni

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ttio with integration extras
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,integration]"

      - name: Run validation + integration suites (no network, no stress)
        working-directory: python
        run: |
          pytest tests/validation tests/integration tests/security \
                 -v --tb=short -m "not stress and not requires_network"

  python-stress:
    name: Python — nightly stress suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      TTIO_RANS_LIB_PATH: ${{ github.workspace }}/native/_build/libttio_rans.so

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev cmake ninja-build

      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib

      - name: Build native rANS library (JNI)
        run: bash scripts/build-native.sh --jni

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ttio with integration extras
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,integration]"

      - name: Run stress suite (no network filter, 10 minute budget)
        working-directory: python
        run: |
          pytest tests/stress tests/validation -v --tb=short \
                 -m "stress or not (stress or requires_network)" \
                 --timeout=600

  python-stress-full-corpus:
    # Monthly slot for the 1.6 GB hg002_illumina chr22 BAM that the
    # default ``python-stress`` job excludes via the
    # ``TTIO_INCLUDE_FULL_CORPUS=1`` env-var gate. Catches perf
    # regressions at full WGS scale that the 200MB-cap default
    # benchmark misses. Triggers only on the 1st-of-month cron.
    name: Python — monthly full-corpus stress
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'
    env:
      TTIO_RANS_LIB_PATH: ${{ github.workspace }}/native/_build/libttio_rans.so
      TTIO_INCLUDE_FULL_CORPUS: "1"
      TTIO_INCLUDE_LONG_TAIL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev cmake ninja-build samtools

      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib

      - name: Build native rANS library (JNI)
        run: bash scripts/build-native.sh --jni

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ttio with integration extras
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,integration]"

      - name: Run full-corpus stress + long-tail FASTQ (60-min budget)
        working-directory: python
        run: |
          pytest tests/stress/test_production_corpus_benchmark.py \
                 tests/stress/test_fasta_fastq_benchmark.py \
                 -v --tb=short --timeout=3600

      - name: Upload benchmark_results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-benchmark-results
          path: python/tests/stress/benchmark_results.json
          if-no-files-found: warn
          retention-days: 90

  python-vendor-fixtures:
    # New cell exercising the optional Bruker TDF + Thermo .raw
    # delegation paths. Catches regressions in the vendor importers
    # on every push instead of only when a developer opts in via
    # scripts/fetch-vendor-fixtures.sh + manual env exports.
    #
    # Public test fixtures (MIT + Apache-2.0) come from upstream
    # repos; the fetcher pins sha256 manifests under
    # data/vendor/{thermo,bruker}/.
    name: Python — vendor-format fixture round-trips
    runs-on: ubuntu-latest
    needs: python-test
    env:
      TTIO_RANS_LIB_PATH: ${{ github.workspace }}/native/_build/libttio_rans.so
      TTIO_THERMO_RAW_FIXTURE: ${{ github.workspace }}/.fixtures/thermo/small.RAW
      TTIO_BRUKER_TDF_FIXTURE: ${{ github.workspace }}/.fixtures/bruker/diaPASEF.d
      TTIO_FIXTURE_ROOT: ${{ github.workspace }}/.fixtures

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev cmake ninja-build mono-complete

      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib

      - name: Build native rANS library (JNI)
        run: bash scripts/build-native.sh --jni

      - name: Install ThermoRawFileParser CLI (mono + v1.4.5 binary)
        # Wrapper script lets the test's shutil.which(...) resolve.
        # See docs/test-strategy.md "Thermo .raw delegation" for the
        # standalone setup outside CI.
        run: |
          mkdir -p ~/opt/ThermoRawFileParser ~/.local/bin
          curl -sL -o /tmp/trfp.zip \
            https://github.com/CompOmics/ThermoRawFileParser/releases/download/v1.4.5/ThermoRawFileParser1.4.5.zip
          unzip -q -o /tmp/trfp.zip -d ~/opt/ThermoRawFileParser
          cat > ~/.local/bin/ThermoRawFileParser <<'EOF'
          #!/usr/bin/env bash
          exec mono "$HOME/opt/ThermoRawFileParser/ThermoRawFileParser.exe" "$@"
          EOF
          chmod +x ~/.local/bin/ThermoRawFileParser
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ~/.local/bin/ThermoRawFileParser --version

      - name: Fetch sha256-pinned vendor fixtures
        run: |
          chmod +x scripts/fetch-vendor-fixtures.sh
          scripts/fetch-vendor-fixtures.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ttio (with bruker extras)
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,integration,bruker]"

      - name: Run vendor-fixture integration tests
        working-directory: python
        run: |
          pytest tests/test_bruker_tdf.py \
                 tests/integration/test_bruker_tdf_integration.py \
                 tests/integration/test_thermo_delegation.py \
                 -v --tb=short

  java-test:
    name: Java — build & test (Maven + JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install samtools (required by BamReader edge-case tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools

      - name: Cache HDF5 1.14
        id: cache-hdf5
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: hdf5-1.14.6-hl-${{ runner.os }}
      - name: Install HDF5 1.14 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (always)
        run: sudo ldconfig /usr/local/lib

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build native libttio_rans (+ JNI for Java tests)
        run: bash scripts/build-native.sh --jni

      - name: Build and test
        working-directory: java
        # V1: `mvn verify` triggers JaCoCo's report execution (bound
        # to the verify phase) which produces target/site/jacoco/.
        run: mvn verify -B

      # V1: publish JaCoCo coverage as artifacts.
      - name: Upload coverage (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage
          path: |
            java/target/site/jacoco/jacoco.xml
            java/target/site/jacoco/jacoco.csv
            java/target/site/jacoco/index.html
            java/target/site/jacoco/jacoco-resources/
          if-no-files-found: warn
          retention-days: 14

  perf-regression:
    name: Performance regression check (Python + ObjC, push-to-main only)
    runs-on: ubuntu-latest
    # V2 (verification workplan): only fires on push to main, not every
    # PR. Perf runs are slow (~3-5 min total) and noisy on shared GHA
    # runners; we accept that regressions are detected after merge
    # rather than during PR review. Maintainers update
    # tools/perf/baseline.json with --update-baseline when accepting
    # an intentional perf change.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-test, objc-build-test]

    env:
      LIBOBJC2_REF: v2.3
      TOOLS_MAKE_REF: make-2_9_3
      LIBS_BASE_REF:  base-1_31_1
      INSTALL_PREFIX: /usr/local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build make git ca-certificates \
            zlib1g-dev libssl-dev libxml2-dev \
            libgnutls28-dev libffi-dev libicu-dev \
            libblocksruntime-dev libcurl4-openssl-dev \
            libwebsockets-dev tzdata \
            python3 python3-pip

      - name: Cache HDF5 1.14 (perf job)
        id: cache-hdf5-perf
        uses: actions/cache@v4
        with:
          # Narrow paths — see cross-compat job for rationale.
          path: |
            /usr/local/include/hdf5*
            /usr/local/include/H5*
            /usr/local/lib/libhdf5*
            /usr/local/lib/libjarhdf5*
            /usr/local/lib/jarhdf5.jar
            /usr/local/share/hdf5_examples
          key: hdf5-1.14.6-hl-${{ runner.os }}-narrow
      - name: Install HDF5 1.14 from source (perf job)
        if: steps.cache-hdf5-perf.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 perf (always)
        run: sudo ldconfig /usr/local/lib

      - name: Cache GNUstep stack
        id: gnustep-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/include/objc
            /usr/local/include/GNUstep
            /usr/local/lib/libobjc.so*
            /usr/local/lib/libgnustep-base*
            /usr/local/lib/GNUstep
            /usr/local/share/GNUstep
            /usr/local/bin/gnustep-config
            /usr/local/bin/gdomap
          key: gnustep-${{ runner.os }}-${{ env.LIBOBJC2_REF }}-${{ env.TOOLS_MAKE_REF }}-${{ env.LIBS_BASE_REF }}-v2

      - name: Build libobjc2 from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          git clone --depth 1 --branch "${LIBOBJC2_REF}" \
            https://github.com/gnustep/libobjc2.git /tmp/libobjc2
          cd /tmp/libobjc2
          git submodule update --init --recursive
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ ..
          ninja
          sudo ninja install

      - name: Build gnustep-make from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          git clone --depth 1 --branch "${TOOLS_MAKE_REF}" \
            https://github.com/gnustep/tools-make.git /tmp/tools-make
          cd /tmp/tools-make
          ./configure --prefix="${INSTALL_PREFIX}" \
            --with-library-combo=ng-gnu-gnu CC=clang
          make
          sudo make install

      - name: Build gnustep-base from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          # shellcheck disable=SC1091
          . "${INSTALL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          git clone --depth 1 --branch "${LIBS_BASE_REF}" \
            https://github.com/gnustep/libs-base.git /tmp/libs-base
          cd /tmp/libs-base
          ./configure CC=clang
          make
          sudo -E make install

      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ttio + perf deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test]"

      - name: Build libTTIO + tools (for ObjC perf)
        working-directory: objc
        run: ./build.sh

      # P2 (perf workplan): Java is now in the regression-detection
      # loop via ProfileHarnessFull --json. Provision JDK + HDF5
      # JNI bindings the same way the cross-compat job does.
      - name: Install JDK 21 + HDF5 Java bindings
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java + materialise runtime classpath
        working-directory: java
        run: |
          mvn -B test-compile -Dhdf5.jar=/usr/local/lib/jarhdf5.jar
          mvn -B dependency:build-classpath \
              -Dmdep.outputFile=target/runtime-classpath.txt

      - name: Run perf harness + compare against baseline
        run: |
          chmod +x tools/perf/run_perf_ci.sh \
                   tools/perf/build_and_run_python_full.sh \
                   tools/perf/build_and_run_objc_full.sh \
                   tools/perf/build_and_run_java_full.sh
          tools/perf/run_perf_ci.sh | tee perf-report.md

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            perf-report.md
            tools/perf/_out_python_full/full.json
            tools/perf/_out_objc_full/full.json
            tools/perf/_out_java_full/full.json
          if-no-files-found: warn
          retention-days: 90

  cross-compat:
    name: Cross-language parity (ObjC ⇄ Python ⇄ Java)
    needs: [objc-build-test, python-test, java-test]
    runs-on: ubuntu-latest

    # Runs the Python test suite against a freshly-built Objective-C
    # tree so the cross-language tests that subprocess into TtioVerify
    # and TtioSign can actually find the binaries. This catches any
    # byte-level divergence between the two writers / signers /
    # codecs before a release tag is pushed.
    env:
      LIBOBJC2_REF: v2.3
      TOOLS_MAKE_REF: make-2_9_3
      LIBS_BASE_REF:  base-1_31_1
      INSTALL_PREFIX: /usr/local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build make git ca-certificates \
            zlib1g-dev libssl-dev libxml2-dev \
            libgnutls28-dev libffi-dev libicu-dev \
            libblocksruntime-dev libcurl4-openssl-dev \
            libwebsockets-dev tzdata

      - name: Cache HDF5 1.14 (cross-compat)
        id: cache-hdf5-cc
        uses: actions/cache@v4
        with:
          # Narrow paths to just what install-hdf5.sh actually writes.
          # The previous `path: /usr/local` swept Android SDK and other
          # runner-image files into the cache, causing tar exit-code-2
          # conflicts on restore (run 25616667918).
          path: |
            /usr/local/include/hdf5*
            /usr/local/include/H5*
            /usr/local/lib/libhdf5*
            /usr/local/lib/libjarhdf5*
            /usr/local/lib/jarhdf5.jar
            /usr/local/share/hdf5_examples
          key: hdf5-1.14.6-hl-${{ runner.os }}-narrow
      - name: Install HDF5 1.14 from source (cross-compat)
        if: steps.cache-hdf5-cc.outputs.cache-hit != 'true'
        run: bash scripts/install-hdf5.sh 1.14.6
      - name: Update ldconfig for HDF5 (cross-compat, always)
        run: sudo ldconfig /usr/local/lib

      - name: Cache GNUstep stack
        id: gnustep-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/include/objc
            /usr/local/include/GNUstep
            /usr/local/lib/libobjc.so*
            /usr/local/lib/libgnustep-base*
            /usr/local/lib/GNUstep
            /usr/local/share/GNUstep
            /usr/local/bin/gnustep-config
            /usr/local/bin/gdomap
          key: gnustep-${{ runner.os }}-${{ env.LIBOBJC2_REF }}-${{ env.TOOLS_MAKE_REF }}-${{ env.LIBS_BASE_REF }}-v2

      - name: Build libobjc2 from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          git clone --depth 1 --branch "${LIBOBJC2_REF}" \
            https://github.com/gnustep/libobjc2.git /tmp/libobjc2
          cd /tmp/libobjc2
          git submodule update --init --recursive
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ ..
          ninja
          sudo ninja install

      - name: Build gnustep-make from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          git clone --depth 1 --branch "${TOOLS_MAKE_REF}" \
            https://github.com/gnustep/tools-make.git /tmp/tools-make
          cd /tmp/tools-make
          ./configure --prefix="${INSTALL_PREFIX}" \
            --with-library-combo=ng-gnu-gnu CC=clang
          make
          sudo make install

      - name: Build gnustep-base from source
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: |
          set -exo pipefail
          # shellcheck disable=SC1091
          . "${INSTALL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          git clone --depth 1 --branch "${LIBS_BASE_REF}" \
            https://github.com/gnustep/libs-base.git /tmp/libs-base
          cd /tmp/libs-base
          ./configure CC=clang
          make
          sudo -E make install

      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      # objc/build.sh's dependency check requires libttio_rans.so; the
      # Java full test suite below requires the JNI shim
      # (libttio_rans_jni.so) for NAME_TOKENIZED_V2. --jni builds both,
      # mirroring java-test's pattern at line 587.
      - name: Build native libttio_rans (+ JNI for Java tests)
        run: bash scripts/build-native.sh --jni

      - name: Build libTTIO + tools
        working-directory: objc
        run: ./build.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ttio with cross-compat extras
        working-directory: python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test]"

      - name: Run cross-language parity tests
        working-directory: python
        env:
          # Let h5py find the LZ4 filter plugin shipped by hdf5plugin
          # so the M21 LZ4 tests run end-to-end in the cross-compat job.
          HDF5_PLUGIN_PATH: ""  # populated by the Python harness
        run: |
          pytest -v --tb=short \
            tests/test_cross_compat.py \
            tests/test_canonical_signatures.py \
            tests/test_compression_codecs.py \
            tests/test_per_run_provenance.py

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java reads ObjC fixtures
        working-directory: java
        run: mvn test -B -Dtest="SpectralDatasetTest#readMinimalMsFixture+readFullMsFixture+readNmr1dFixture"

      - name: Java full test suite
        working-directory: java
        run: mvn verify -B
