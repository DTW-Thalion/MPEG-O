# Per-format descriptions surfaced as the ImportDialog tooltip / help text.
# Keys: import.<format-name>.description (spaces in format names escaped with \)
import.mzML.description = HUPO PSI mass-spectrometry XML; indexed mzML supported; chromatograms preserved
import.mzTab.description = Tabular MS results; proteomics-1.0 and metabolomics-2.0.0-M dialects auto-detected
import.imzML.description = MS imaging container (.imzML + .ibd); continuous and processed modes
import.nmrML.description = NMR XML container; FID payloads widened to complex128 on import
import.JCAMP-DX.description = JCAMP-DX 5.01; AFFN + compressed (PAC/SQZ/DIF/DUP); Raman/IR/UV-Vis dispatch
import.Bruker\ timsTOF.description = Bruker timsTOF .d directory; SQLite metadata in-process; binary frames via Python helper
import.Waters\ MassLynx.description = Waters MassLynx .raw directory; converts via masslynxraw to mzML
import.Thermo\ .raw.description = Thermo .raw file; shells out to ThermoRawFileParser then ingests mzML
import.BAM.description = SAM/BAM via samtools; produces a genomic run; optional reference fasta
import.SAM.description = SAM text via samtools; convenience alias for BamReader
import.CRAM.description = CRAM via samtools; reference fasta required
import.FASTA.description = FASTA reference (default) or unaligned reads; gzip auto-detected
import.FASTQ.description = FASTQ reads; Phred offset auto-detected (or force Phred+33 / Phred+64)
